# LaDDR release v1.0.0 from its repository, with the Python stack of the test
# baseline env (tests/hpc/envs/baseline-pheno.lock.txt): every conda package,
# transitive ones included, as name=version=build from that lock, with three
# exceptions. scipy is 1.16.3 (LaDDR requires scipy<1.17; the lock has 1.17.1,
# which pip would silently replace). scikit-learn is 1.5.2 because the lock's
# 1.9.1 was seen to fail: `laddr coverage` passes PCA a frame with duplicate
# integer column names, which 1.9.1 rejects (narwhals `DuplicateError`; Task 22).
# 1.5.2 is a known-good version, chosen because LaDDR's requirements.txt names
# it (LaDDR's pyproject.toml leaves scikit-learn unbounded, and its other
# requirements.txt pins are not followed here). icu is unpinned (it resolves to the lock's
# 73.2=h59595ed_0).
# pyBigWig, matplotlib (scikit-fda), pillow, wrapt and cffi are in the lock too,
# so they are pinned here rather than left to pip (Task 22).
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12.3=hab00c5b_0_cpython
  - numpy=1.26.4=py312heda63a1_0
  - pandas=2.3.3=py312hf79963d_1
