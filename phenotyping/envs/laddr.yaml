# Best effort (LaDDR is verified by dry run only): LaDDR from its repository,
# with the Python stack of the test baseline env.
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12.3
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.17.1
  - scikit-learn=1.9.1
  - gtfparse=2.5.0
  - polars=0.20.31
  - pyarrow=16.1.0
  - pyyaml=6.0.3
  - pip
  - pip:
      - git+https://github.com/PejLab/LaDDR.git
