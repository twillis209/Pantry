# Legacy: upstream's single environment, unchanged and not tested here. It
# covers only the conda rules. tensorQTL and TWAS (pheast) and MAJIQ (when
# majiq_container is set) need apptainer. The per-rule environments in envs/
# (--sdm conda) are the maintained route.
name: pantry
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - bedtools
  - bioconductor-genomicranges # for RNA editing
  - bioconductor-rtracklayer # for RNA editing
  - deeptools # for bamCoverage used by optional LaDDR workflow
  - gffread # for txrevise
  - graphviz # for plotting pipeline diagrams
  - gtfparse
  - htslib # for bgzip and MAJIQ (intron retention)
  - kallisto=0.48.0
  - r-tidyverse # for txrevise and RNA editing
  - r-optparse # for txrevise
  - r-txrevise
  - regtools>=1.0.0
  - samtools
  - scikit-learn
  - snakemake
  - snakemake-executor-plugin-slurm # change as needed for your cluster
  - star
  - subread
