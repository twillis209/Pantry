name: tensorqtl-image

on:
  push:
    paths:
      - "containers/tensorqtl/**"
      - ".github/workflows/tensorqtl-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/twillis209/pantry-tensorqtl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (torch + CUDA wheels are several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=1.0.10
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/twillis209/Pantry
            org.opencontainers.image.title=pantry-tensorqtl
            org.opencontainers.image.version=1.0.10

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: containers/tensorqtl
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Digest
        run: echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
