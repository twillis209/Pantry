# Check the published images' pins (containers/pins/*): the recipe inputs are
# unchanged since the build that produced the pinned digest, the step files use
# that digest, and the manifest is anonymously pullable. No docker, no build.
name: image-pins

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check image pins
        run: bash containers/check_pins.sh
