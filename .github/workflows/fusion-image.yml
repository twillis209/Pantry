name: fusion-image

on:
  push:
    branches:
      - module
    paths:
      - "containers/fusion/**"
      - "pheast/scripts/fusion_twas/**"
      - "pheast/envs/fusion.yaml"
      - ".github/workflows/fusion-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/twillis209/pantry-fusion

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/twillis209/Pantry
            org.opencontainers.image.title=pantry-fusion

      # Context is the repository root, for pheast/envs/fusion.yaml and
      # pheast/scripts/fusion_twas/; containers/fusion/Dockerfile.dockerignore
      # limits what is sent.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/fusion/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Digest
        run: echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
