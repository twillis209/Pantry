# Build env for MAJIQ v3 (Biociphers, academic build); the conda part only.
# MAJIQ itself is pip-installed from source by majiq3-install.sh, which
# points the build at this env's htslib (the yml's pip: section cannot).
# Every package, transitive ones (compilers, sysroot, kernel headers) included,
# is pinned as name=version=build to majiq3.lock.txt (the env of job 8399463,
# the runtime-verified build); the pip packages are pinned by constraints.txt.
name: majiq3
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12.16=h5f976f7_0_cpython
  - pip=26.2.2=pyh8b19718_2
  - setuptools=84.2.1=pyhe730653_0
  - git=2.56.0=pl5440h3795e67_0
  - cmake=4.4.5=hff7ac6b_0
  - make=4.4.1=h1114479_4
  - cxx-compiler=2.0.0=hdab9b82_0
  - htslib=1.25=ha79157c_0
  # Compression libraries of the bundled bxzstr (headers too: the
  # system liblzma has none).
  - zstd=1.5.7=hb78ec9c_7
  - xz=5.8.3=ha02ee65_1
  - liblzma-devel=5.8.3=hb03c661_1
  - bzip2=1.0.8=hda65f42_10
  - zlib=1.3.2=h25fd6f3_3
