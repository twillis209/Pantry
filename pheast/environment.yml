# Legacy: upstream's single environment, unchanged and not tested here. It
# covers only the conda rules. tensorQTL, TWAS and MAJIQ (phenotyping, when
# majiq_container is set) run in containers under apptainer; without apptainer
# the tensorQTL rules use the python3 on PATH (e.g. this env) and TWAS cannot
# run. The per-rule environments in envs/ (--sdm conda) are the maintained route.
name: pheast
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - bioconductor-impute # for covariates
  - bioconductor-qvalue # for tensorqtl
  - dask<2024.2 # for tensorqtl (pandas-plink)
  - gemma=0.98.5 # for FUSION BLUP models
  - gcta # for heritability
  - htslib # for bgzip
  - pandas
  - pandas-plink # for tensorqtl
  - pip
  - plink
  - plink2=2
  - r-glmnet # for FUSION
  - r-optparse
  - rpy2 # for tensorqtl
  - snakemake
  - snakemake-executor-plugin-slurm # change as needed for your cluster
  - pip:
      - tensorqtl
      - torch==2.3.1 # for tensorqtl
